name: Continuous build semi-weekly tests

on:
  push:
    branches:
      - scheduled_tests
  schedule:
   - cron:  '00 13 * * 1,5' # Mo,Fr at 13:00 UTC

jobs:
  run_tests:
    # run by cron only in CESNET/UltraGrid, on push to run_tests anywhere
    if: github.repository == 'CESNET/UltraGrid' || github.event.schedule == null
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: macos-latest
            runner_var: MACOS_ARM64_RUNNER # custom runner - repo var name

    runs-on: ${{ vars[matrix.runner_var] || matrix.os }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: ${{ matrix.os == 'windows-latest' && 'C:\shells\msys2bash.cmd {0}' || 'bash {0}' }}

    steps:
    - uses: actions/checkout@main
    - name: Test continuous
      shell: bash
      run: .github/scripts/run_scheduled_tests.sh
    - name: Test latest release
      shell: bash
      run: .github/scripts/run_scheduled_tests.sh release
